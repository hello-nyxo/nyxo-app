name: 'build-test'
on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn lint
      - run: yarn test
        env:
          CI: true
